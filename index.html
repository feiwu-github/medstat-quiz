<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="医学统计学选择题练习：乱序、自动判分、正确答案与解析。">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="统计学练习">
  <title>医学统计学 · 选择题练习</title>
  <style>:root {
  color-scheme: light;
  --bg: #f3f0e8;
  --bg-deep: #e9e2d5;
  --card: rgba(255, 255, 255, 0.86);
  --card-solid: #fffdf8;
  --text: #1d2923;
  --muted: #69766e;
  --line: rgba(29, 41, 35, 0.12);
  --line-strong: rgba(29, 41, 35, 0.2);
  --accent: #176b52;
  --accent-2: #2e9b77;
  --accent-soft: rgba(23, 107, 82, 0.09);
  --correct: #137a52;
  --correct-bg: #e7f4ed;
  --wrong: #b13a2d;
  --wrong-bg: #fbece8;
  --shadow: 0 24px 70px rgba(40, 45, 38, 0.12);
  --shadow-soft: 0 8px 24px rgba(40, 45, 38, 0.07);
  --radius: 24px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101613;
    --bg-deep: #0a0f0d;
    --card: rgba(23, 32, 28, 0.9);
    --card-solid: #18211d;
    --text: #e8eee9;
    --muted: #9aa89f;
    --line: rgba(232, 238, 233, 0.13);
    --line-strong: rgba(232, 238, 233, 0.22);
    --accent: #71d3ae;
    --accent-2: #98e5c6;
    --accent-soft: rgba(113, 211, 174, 0.11);
    --correct: #83e2b9;
    --correct-bg: rgba(24, 83, 61, 0.4);
    --wrong: #ff9f8e;
    --wrong-bg: rgba(112, 40, 31, 0.42);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 0%, rgba(46, 155, 119, 0.16), transparent 34rem),
    radial-gradient(circle at 95% 12%, rgba(196, 152, 78, 0.12), transparent 30rem),
    linear-gradient(145deg, var(--bg), var(--bg-deep));
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.32;
  background-image:
    linear-gradient(rgba(29, 41, 35, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 41, 35, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, black, transparent 78%);
  -webkit-mask-image: linear-gradient(to bottom, black, transparent 78%);
}

::selection {
  background: var(--accent);
  color: #fff;
}

.shell {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 18px 20px 28px;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, var(--accent), #0c4d3a);
  box-shadow: 0 8px 20px rgba(23, 107, 82, 0.22);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  font-weight: 700;
}

h1 {
  margin: 0;
  font-size: clamp(18px, 2vw, 22px);
  line-height: 1.2;
  letter-spacing: 0.01em;
}

.brand p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.toolbar {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
}

.btn {
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 11px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease,
    background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}

.btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.btn:focus-visible,
.option:focus-visible,
.sheet-cell:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.btn.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 20px rgba(23, 107, 82, 0.22);
}

.btn.primary:hover:not(:disabled) {
  background: #0f5b45;
  color: #fff;
}

.btn.ghost {
  background: transparent;
}

.meta-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 4px 0 8px;
}

.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--card);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.3;
}

.pill strong {
  color: var(--accent);
  font-weight: 700;
}

.stats {
  display: flex;
  align-items: stretch;
  overflow: hidden;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  box-shadow: var(--shadow-soft);
}

.stat {
  display: flex;
  flex: 1;
  align-items: baseline;
  justify-content: center;
  min-width: 0;
  gap: 6px;
  padding: 7px 6px;
  border-left: 1px solid var(--line);
  background: transparent;
  box-shadow: none;
}

.stat:first-child {
  border-left: 0;
}

.stat span {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat small {
  display: block;
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.stat.correct span {
  color: var(--correct);
}

.stat.wrong span {
  color: var(--wrong);
}

.progress-track {
  height: 6px;
  margin: 0 0 10px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--line);
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.3s ease;
}

.question-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: clamp(16px, 2.4vw, 22px);
  background: var(--card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.q-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.q-index {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.q-origin {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 3px 7px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.q-text {
  margin: 0 0 14px;
  font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
  font-size: clamp(17px, 1.8vw, 20px);
  font-weight: 600;
  line-height: 1.55;
  white-space: pre-wrap;
}

.options {
  display: grid;
  gap: 6px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 14px;
  line-height: 1.5;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.16s ease, background 0.16s ease,
    transform 0.16s ease, box-shadow 0.16s ease;
}

.option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.option.is-correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.option.is-wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.option-key {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card-solid);
  font-size: 12px;
  font-weight: 700;
}

.option.selected .option-key {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.option.is-correct .option-key {
  border-color: var(--correct);
  background: var(--correct);
  color: #fff;
}

.option.is-wrong .option-key {
  border-color: var(--wrong);
  background: var(--wrong);
  color: #fff;
}

.option-text {
  padding-top: 2px;
  white-space: pre-wrap;
}

.feedback {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
}

.feedback.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.feedback.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}

.feedback-title {
  margin-bottom: 4px;
  font-size: 13px;
  font-weight: 700;
}

.feedback.correct .feedback-title {
  color: var(--correct);
}

.feedback.wrong .feedback-title {
  color: var(--wrong);
}

.answer-line {
  margin-top: 3px;
  font-size: 13px;
  line-height: 1.6;
}

.answer-line strong {
  color: var(--accent);
}

.explanation {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.q-text,
.option-text,
.answer-line,
.explanation {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.actions .spacer {
  flex: 1;
}

.hint {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.completion {
  padding: 26px 10px 10px;
  text-align: center;
}

.completion .mark {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 36px;
}

.completion h2 {
  margin: 0 0 8px;
  font-size: 26px;
}

.completion p {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.7;
}

.completion .actions {
  justify-content: center;
}

.foot {
  margin-top: 18px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.75;
  text-align: center;
}

.sheet {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(5, 12, 9, 0.58);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
}

.sheet[hidden] {
  display: none;
}

.sheet-panel {
  width: min(900px, 100%);
  max-height: min(82vh, 780px);
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  background: var(--card-solid);
  box-shadow: var(--shadow);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.sheet-head h3 {
  margin: 0;
  font-size: 18px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 12px;
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 5px;
  border-radius: 3px;
  vertical-align: -1px;
}

.legend .l-correct {
  background: var(--correct);
}

.legend .l-wrong {
  background: var(--wrong);
}

.legend .l-unanswered {
  border: 1px solid var(--line-strong);
}

.sheet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 7px;
}

.sheet-cell {
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.sheet-cell:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.sheet-cell.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  color: var(--correct);
}

.sheet-cell.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  color: var(--wrong);
}

.sheet-cell.current {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  color: var(--accent);
  font-weight: 700;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 60;
  transform: translate(-50%, 18px);
  border-radius: 999px;
  padding: 10px 16px;
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 720px) {
  .shell {
    padding: 14px 12px 24px;
  }

  .meta-strip {
    display: none;
  }

  .topbar {
    display: block;
  }

  .toolbar {
    justify-content: flex-start;
    margin-top: 8px;
  }

  .stat {
    gap: 3px;
    padding: 6px 3px;
  }

  .stat span {
    font-size: 18px;
  }

  .stat small {
    font-size: 9px;
  }

  .question-card {
    border-radius: 16px;
    padding: 14px;
  }

  .q-text {
    font-size: 17px;
  }

  .option {
    padding: 8px 9px;
  }

  .actions .hint {
    flex-basis: 100%;
  }

  .sheet {
    padding: 10px;
  }

  .sheet-panel {
    padding: 16px;
  }
}

@media (max-width: 420px) {
  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    font-size: 23px;
  }

  .btn {
    padding: 7px 10px;
    font-size: 11.5px;
  }

  .stat {
    padding: 6px 2px;
  }

  .stat span {
    font-size: 17px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">∑</div>
        <div>
          <h1>医学统计学 · 选择题练习</h1>
          <p>乱序练习 · 自动判分 · <span id="totalLabel">399</span> 题</p>
        </div>
      </div>
      <div class="toolbar">
        <button type="button" class="btn ghost" id="sheetBtn">答题卡</button>
        <button type="button" class="btn ghost" id="shuffleBtn">重新打乱</button>
        <button type="button" class="btn ghost" id="resetBtn">重置</button>
      </div>
    </header>

    <div class="meta-strip" aria-label="题库说明">
      <span class="pill">原题 <strong id="originalLabel">435</strong> 道</span>
      <span class="pill">保留 <strong id="totalLabelMeta">399</strong> 道</span>
      <span class="pill">已剔除 <strong id="removedLabel">36</strong> 道</span>
      <span class="pill">乱序出题</span>
      <span class="pill">重复题已合并</span>
    </div>

    <section class="stats" aria-label="答题统计">
      <div class="stat"><span id="statAnswered">0</span><small>已答</small></div>
      <div class="stat correct"><span id="statCorrect">0</span><small>答对</small></div>
      <div class="stat wrong"><span id="statWrong">0</span><small>答错</small></div>
      <div class="stat"><span id="statAccuracy">—</span><small>正确率</small></div>
    </section>

    <div class="progress-track" id="progressTrack" role="progressbar" aria-label="答题进度"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="question-card" id="questionCard" aria-live="polite">
      <p class="q-text">正在准备题库…</p>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="答题卡">
      <div class="sheet-head">
        <h3>答题卡</h3>
        <button type="button" class="btn ghost" id="closeSheet">关闭</button>
      </div>
      <div class="legend">
        <span><i class="l-correct"></i>答对</span>
        <span><i class="l-wrong"></i>答错</span>
        <span><i class="l-unanswered"></i>未答</span>
      </div>
      <div class="sheet-grid" id="sheetGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    window.__QUIZ_META__ = {
      original: 435,
      kept: 399,
      topicRemoved: 28,
      duplicateRemoved: 8,
      removed: 36
    };

":"D","text":"Fridman M检验"},{"key":"E","text":"Kruskal Wills H检验"}],"answer":"C","explanation":""},{"id":207,"q":"定量资料两组比较的假设检验,首先应考虑:","options":[{"key":"A","text":"t检验"},{"key":"B","text":"秩和检验"},{"key":"C","text":"方差分析"},{"key":"D","text":"资料符合t检验还是秩和检验的条件"},{"key":"E","text":"χ2检验"}],"answer":"D","explanation":""},{"id":208,"q":"两样本秩和检验,若n1=12,T1=3,n2=10,T2=80,查T界值表0.05检验水准对应的T界值范围为84~146,则P值为:","options":[{"key":"A","text":"P>0.05"},{"key":"B","text":"P<0.05"},{"key":"C","text":"P=0.05"},{"key":"D","text":"P≤0.05"},{"key":"E","text":"P≥0.05"}],"answer":"B","explanation":""},{"id":209,"q":"以下方法中属于参数检验方法的是:","options":[{"key":"A","text":"t检验"},{"key":"B","text":"H检验"},{"key":"C","text":"M检验"},{"key":"D","text":"Wilcoxon符号秩和检验"},{"key":"E","text":"Wilcoxon秩和检验"}],"answer":"A","explanation":""},{"id":210,"q":"两组定量资料的比较,若已知n1、n2均小于30,总体方差不齐且呈极度偏态分布,宜采用:","options":[{"key":"A","text":"t’检验"},{"key":"B","text":"H检验"},{"key":"C","text":"M检验"},{"key":"D","text":"Wilcoxon符号秩和检验"},{"key":"E","text":"Wilcoxon秩和检验"}],"answer":"E","explanation":""},{"id":211,"q":"样本均数与已知总体均数比较进行假设检验时,无效假设是:","options":[{"key":"A","text":"样本均数与总体均数相同"},{"key":"B","text":"样本均数与总体均数不同"},{"key":"C","text":"样本代表的未知总体均数与总体均数相同"},{"key":"D","text":"样本代表的未知总体均数与总体均数不同"},{"key":"E","text":"样本均数与已知总体抽取的样本均数相同"}],"answer":"C","explanation":"假设检验的基本原理,无效假设H0又称为零假设、原假设,指两总体均数相同。"},{"id":212,"q":"样本均数与已知总体均数比较进行假设检验时,备择假设是:","options":[{"key":"A","text":"样本均数与总体均数相同"},{"key":"B","text":"样本均数与总体均数不同"},{"key":"C","text":"样本代表的未知总体均数与总体均数相同"},{"key":"D","text":"样本代表的未知总体均数与总体均数不同"},{"key":"E","text":"样本均数与已知总体抽取的样本均数相同"}],"answer":"D","explanation":"假设检验的基本原理,备择假设H1指两总体均数不同。"},{"id":213,"q":"检验水准是指:","options":[{"key":"A","text":"1-β"},{"key":"B","text":"β"},{"key":"C","text":"α"},{"key":"D","text":"1-α"},{"key":"E","text":"β+α"}],"answer":"C","explanation":"检验水准用α表示"},{"id":214,"q":"假设检验时,用单侧检验还是双侧检验的依据:","options":[{"key":"A","text":"检验水准的大小"},{"key":"B","text":"研究者的意愿"},{"key":"C","text":"专业知识判断"},{"key":"D","text":"数据资料的分布类型"},{"key":"E","text":"数据类型"}],"answer":"C","explanation":"根据常识或专业知识判断用单侧还是双侧检验"},{"id":215,"q":"假设检验的步骤中,单侧检验与双侧检验的不同点在于:","options":[{"key":"A","text":"根据检验水准查界值不同"},{"key":"B","text":"计算公式不同"},{"key":"C","text":"检验水准不同"},{"key":"D","text":"查得界值与统计量比较方法不同"},{"key":"E","text":"自由度的计算不同"}],"answer":"A","explanation":"单侧检验与双侧检验在假设检验步骤中,不同处有H1、查得界值、所得结论可能相同也可能不同。"},{"id":216,"q":"对第一类错误说法正确的是:","options":[{"key":"A","text":"拒绝了实际上成立的H0"},{"key":"B","text":"不拒绝实际上不成立的H0"},{"key":"C","text":"又称为β错误"},{"key":"D","text":"又称为存伪错误"},{"key":"E","text":"又称为检验效能"}],"answer":"A","explanation":"第一类错误又称为I型错误、α错误、弃真错误,拒绝了实际上成立的H0"},{"id":217,"q":"对第二类错误说法正确的是:","options":[{"key":"A","text":"拒绝了实际上成立的H0"},{"key":"B","text":"不拒绝实际上不成立的H0"},{"key":"C","text":"又称为α错误"},{"key":"D","text":"又称为弃真错误"},{"key":"E","text":"又称为检验效能"}],"answer":"B","explanation":"第二类错误又称为II型错误、β错误、存伪错误,不拒绝了实际上不成立的H0"},{"id":218,"q":"第一类错误是指()错误:","options":[{"key":"A","text":"1-β"},{"key":"B","text":"β"},{"key":"C","text":"α"},{"key":"D","text":"1-α"},{"key":"E","text":"β+α"}],"answer":"C","explanation":"第一类错误又称为I型错误、α错误"},{"id":219,"q":"误诊率是指:","options":[{"key":"A","text":"β错误"},{"key":"B","text":"α错误"},{"key":"C","text":"第二类错误"},{"key":"D","text":"1-α"},{"key":"E","text":"1-β"}],"answer":"B","explanation":"正常人诊断为病人,弃真,所以是第一类错误又称为I型错误、α错误"},{"id":220,"q":"对检验效能说法错误的是:","options":[{"key":"A","text":"两总体确有差异,根据检验水准发现这种差异的能力"},{"key":"B","text":"β越小,检验效能越大"},{"key":"C","text":"又称为把握度"},{"key":"D","text":"用1-β表示"},{"key":"E","text":"检验效能越高,犯错误的概率越小"}],"answer":"E","explanation":"检验效能越高,即1-β越大,β越小,此时推断结论犯α错误的错误会越大,犯β错误越小。因此不能笼统说犯错误的概率越小。"},{"id":221,"q":"两样本均数比较时,分别取以下检验水准,α选择以下哪项时所对应的第二类错误最小?","options":[{"key":"A","text":"0.01"},{"key":"B","text":"0.05"},{"key":"C","text":"0.10"},{"key":"D","text":"0.20"},{"key":"E","text":"0.25"}],"answer":"E","explanation":"样本量确定的情况下,α增大β减少,反之α减少β增大。所以第二类错误最小即β最小,则α应最大。"},{"id":222,"q":"在比较两样本均数的假设检验中,结果t=3.24，t0.05,v=2.086，t0.01,v=2.845。正确的结论是:","options":[{"key":"A","text":"两样本均数不同"},{"key":"B","text":"两样本均数差异很大"},{"key":"C","text":"两总体均数差异很大"},{"key":"D","text":"两样本均数来自同一总体"},{"key":"E","text":"两样本均数来自不同总体"}],"answer":"E","explanation":"t值大于t界值,所以P小于0.05,所以拒绝H0,接受H1,可认为两总体均数不同,样本来自不同的总体。"},{"id":223,"q":"在比较两样本均数的假设检验中,若检验统计量t值越大,则结论为:","options":[{"key":"A","text":"P值越小,越有理由认为两样本均数不同"},{"key":"B","text":"P值越小,越有理由认为两样本均数差异很大"},{"key":"C","text":"P值越大,越有理由认为两总体均数差异很大"},{"key":"D","text":"P值越大,越有理由认为两样本均数来自同一总体"},{"key":"E","text":"P值越小,越有理由认为两样本均数来自不同总体"}],"answer":"E","explanation":"p的含义,p值越小,越有理由认为H0不成立,H1成立。"},{"id":224,"q":"假设检验时,犯第二类错误最小的是:。","options":[{"key":"A","text":"α=0.05"},{"key":"B","text":"α=0.01"},{"key":"C","text":"α=0.15"},{"key":"D","text":"α=0.20"},{"key":"E","text":"α=0.30"}],"answer":"E","explanation":"样本量确定的情况下,α增大β减少,反之α减少β增大。所以第二类错误最小即β最小,则α应最大。"},{"id":225,"q":"关于假设检验,下列叙述正确的是:","options":[{"key":"A","text":"单侧检验优于双侧检验"},{"key":"B","text":"采用配对t检验还是成组t检验由实验设计方法决定"},{"key":"C","text":"检验结果若P值大于0.05,则不拒绝H0犯错误的可能性很小"},{"key":"D","text":"两样本均数比较时,不要求方差齐性"},{"key":"E","text":"由于配对t检验的效率高于成组t检验,因此最好都用配对t检验"}],"answer":"B","explanation":"检验方法都是要根据实验设计、资料类型、检验应用的条件等决定。"},{"id":226,"q":"定量资料,配对t检验的无效假设(双侧检验)为:。","options":[{"key":"A","text":"μd=0"},{"key":"B","text":"μd≠0"},{"key":"C","text":"μ1=μ2"},{"key":"D","text":"μ1≠μ2"},{"key":"E","text":"μ=μ0"}],"answer":"A","explanation":"无效假设,未知总体的差值为0"},{"id":227,"q":"作假设检验时,下列叙述哪项正确:","options":[{"key":"A","text":"有统计意义时,则一定有实际意义"},{"key":"B","text":"有实际意义时,则一定得出有统计意义"},{"key":"C","text":"有统计意义时,可能也有实际意义"},{"key":"D","text":"无统计意义时,也一定无实际意义"},{"key":"E","text":"无实际意义时,也一定无统计意义"}],"answer":"C","explanation":"统计学意义与实际或专业意义有一定的差异,查看假设检验与置信区间的区别与联系。"},{"id":228,"q":"正态性检验时,为了减少第Ⅱ类错误的概率,检验水准取下列哪种好:","options":[{"key":"A","text":"α=0.01"},{"key":"B","text":"α=0.05"},{"key":"C","text":"α=0.10"},{"key":"D","text":"α=0.20"},{"key":"E","text":"α=0.02"}],"answer":"D","explanation":"样本量确定的情况下,α增大β减少,反之α减少β增大。所以第二类错误最小即β最小,则α应最大。"},{"id":229,"q":"关于假设检验和统计学意义,下列叙述不正确的是:","options":[{"key":"A","text":"资料须符合随机的原则"},{"key":"B","text":"资料须具有可比性"},{"key":"C","text":"t检验条件必须满足两总体的方差相等"},{"key":"D","text":"差别有统计学意义说明比较的两样本来自不同总体"},{"key":"E","text":"差别有统计学意义说明比较的两总体差别较大"}],"answer":"E","explanation":""},{"id":230,"q":"下列关于Ι型错误(第一类错误)和Ⅱ型错误(第二类错误),叙述不正确的是:","options":[{"key":"A","text":"Ⅰ型错误的概率用α表示"},{"key":"B","text":"Ⅱ型错误的概率用β表示"},{"key":"C","text":"样本量固定时,Ⅰ型错误的概率越大,Ⅱ型错误的概率也越大"},{"key":"D","text":"样本量固定时,Ⅰ型错误的概率越大,Ⅱ型错误的概率越小"},{"key":"E","text":"要同时减小Ⅰ型错误和Ⅱ型错误的概率,需增大样本量"}],"answer":"C","explanation":"参考两类错误的区别与联系"},{"id":231,"q":"两样本均数比较,经t检验,差别有统计学意义,P越小说明:","options":[{"key":"A","text":"两样本均数差别越大"},{"key":"B","text":"两总体均数差别越大"},{"key":"C","text":"越有理由认为两总体均数不同"},{"key":"D","text":"越有理由认为两样本均数差值大于0"},{"key":"E","text":"越有理由认为两样本均数有差异"}],"answer":"C","explanation":"判断的一定是总体是否相同"},{"id":232,"q":"在两样本均数的t检验中,备择假设H1是( )。","options":[{"key":"A","text":"两样本均数相等"},{"key":"B","text":"两总体均数相等"},{"key":"C","text":"两总体均数不相等"},{"key":"D","text":"两样本均数差别无统计学意义"},{"key":"E","text":"两总体均数差别无统计学意义"}],"answer":"C","explanation":"备择假设一定是两总体不相同。"},{"id":233,"q":"12名妇女分别用两种仪器测量肺活量最大呼气率(1/min),若该资料符合参数检验条件,现比较两种方法检测结果有无差别,可选择:","options":[{"key":"A","text":"单样本t检验"},{"key":"B","text":"成组设计t检验"},{"key":"C","text":"成组设计Z检验"},{"key":"D","text":"配对设计t检验"},{"key":"E","text":"配对设计秩和检验"}],"answer":"D","explanation":"配对设计的一种设计类型,同一样品采用不同的方法检测,比较两种检测方法是否相同。"},{"id":234,"q":"关于检验效能,下列叙述错误的是:","options":[{"key":"A","text":"两总体均数确有差别时,按α水准发现这种差别的能力"},{"key":"B","text":"两总体均数确有差别时,按1‐β水准发现这种差别的能力"},{"key":"C","text":"与α有关"},{"key":"D","text":"与样本例数有关"},{"key":"E","text":"与两总体均数间的位置有关"}],"answer":"B","explanation":"检验效能的含义及计算公式"},{"id":235,"q":"假设检验中,P与α的关系是:","options":[{"key":"A","text":"P越大,α越大"},{"key":"B","text":"P越大,α越小"},{"key":"C","text":"二者均事先确定"},{"key":"D","text":"二者均需通过计算机确定"},{"key":"E","text":"P值的大小与α的大小无关"}],"answer":"E","explanation":"检验水准α是事先确定的,p值是根据数据计算得出的,通过p与α的比较,判断H0成立还是H1成立。"},{"id":236,"q":"某假设检验,检验水准为0.05,经计算P<0.05,拒绝H0,此时若推断有错,其错误的概率为:","options":[{"key":"A","text":"0.01"},{"key":"B","text":"0.95"},{"key":"C","text":"β,β=0.01"},{"key":"D","text":"β,β未知"},{"key":"E","text":"α,α=0.05"}],"answer":"E","explanation":"拒绝H0,弃真错误,α错误,所以是0.05"},{"id":237,"q":"已知某地正常人某定量指标的总体均值μ0=5,今随机测得该地特殊人群中的30人该指标的数值。若用t检验推断该特殊人群该指标的总体均值μ与μ0之间是否有差别,则自由度为:","options":[{"key":"A","text":"5"},{"key":"B","text":"28"},{"key":"C","text":"29"},{"key":"D","text":"4"},{"key":"E","text":"30"}],"answer":"C","explanation":"自由度n-1"},{"id":238,"q":"假设检验的一般步骤中不包括下列哪项:","options":[{"key":"A","text":"建立检验假设,确定检验水准"},{"key":"B","text":"对总体参数的置信区间做出估计"},{"key":"C","text":"选定检验方法,计算检验统计量"},{"key":"D","text":"确定P值,作出统计推断结论"},{"key":"E","text":"直接计算P值"}],"answer":"B","explanation":"置信区间的估计不包括在假设检验步骤中。"},{"id":239,"q":"关于假设检验,下列叙述正确的是:","options":[{"key":"A","text":"备择假设用H0表示"},{"key":"B","text":"检验水准的符号为β"},{"key":"C","text":"P可以事先确定"},{"key":"D","text":"一定要计算检验统计量"},{"key":"E","text":"假设检验是针对总体的特征进行"}],"answer":"E","explanation":"统计推断是推断总体特征"},{"id":240,"q":"假设检验,当P<0.05,拒绝原假设时,其依据是:","options":[{"key":"A","text":"原假设本身是人为的,应当拒绝"},{"key":"B","text":"计算结果证明原假设是错误"},{"key":"C","text":"原假设成立是完全荒谬的"},{"key":"D","text":"原假设成立的可能性很小"},{"key":"E","text":"原假设不可能成立"}],"answer":"D","explanation":"P值的含义。"},{"id":241,"q":"第一类错误是指:","options":[{"key":"A","text":"拒绝实际上并不成立的H0"},{"key":"B","text":"不拒绝实际上并不成立的H0"},{"key":"C","text":"拒绝实际上是成立的H0"},{"key":"D","text":"接受实际上是成立的H0"},{"key":"E","text":"拒绝实际上并不成立的H1"}],"answer":"C","explanation":"两类错误的概念"},{"id":242,"q":"某医学资料数据大的一端没有确定数值,描述其集中趋势适用的统计指标是:","options":[{"key":"A","text":"M"},{"key":"B","text":"G"},{"key":"C","text":"均数"},{"key":"D","text":"p95"},{"key":"E","text":"CV"}],"answer":"A","explanation":"集中趋势指标的应用条件"},{"id":243,"q":"对于正态分布资料,理论上:","options":[{"key":"A","text":"均数比中位数大"},{"key":"B","text":"均数比中位数小"},{"key":"C","text":"均数等于中位数"},{"key":"D","text":"均数与中位数无法确定孰大孰小"},{"key":"E","text":"以上说法均不正确"}],"answer":"C","explanation":"正态分布特征"},{"id":244,"q":"下面哪种资料适合于计算算术均数:","options":[{"key":"A","text":" "}],"answer":"A","explanation":"中位数适用条件:偏态分布"},{"id":253,"q":"当资料两端含有不确定值时,描述其变异度宜采用:","options":[{"key":"A","text":"R"},{"key":"B","text":"CV"},{"key":"C","text":"G"},{"key":"D","text":"S"},{"key":"E","text":"Q"}],"answer":"E","explanation":"变异度指标的应用条件"},{"id":254,"q":"关于标准差,错误的是:","options":[{"key":"A","text":"反映全部观察值的离散程度"},{"key":"B","text":"度量了一组数据偏离均数的大小"},{"key":"C","text":"反映了均数代表性的好坏"},{"key":"D","text":"一定大于或等于零"},{"key":"E","text":"不会小于算术均数"}],"answer":"E","explanation":"标准差公式及意义"},{"id":255,"q":"正态曲线下,横轴上均数±1.96标准差范围内的面积是总面积的:","options":[{"key":"A","text":"99%"},{"key":"B","text":"5%"},{"key":"C","text":"90%"},{"key":"D","text":"95%"},{"key":"E","text":"97.5%"}],"answer":"D","explanation":"正态分布曲线下面积"},{"id":256,"q":"比较老鼠与大象的体重变异度大小,宜采用:","options":[{"key":"A","text":"标准差"},{"key":"B","text":"方差"},{"key":"C","text":"极差"},{"key":"D","text":"四分位数间距"},{"key":"E","text":"变异系数"}],"answer":"E","explanation":"两者体重均数差别很大,导致标准差无法直接比较离散程度。"},{"id":257,"q":"四分位数间距是指:","options":[{"key":"A","text":"Q2-Q1"},{"key":"B","text":"Q3-Q1"},{"key":"C","text":"Q3-Q2"},{"key":"D","text":"P100-P1"},{"key":"E","text":"P50-P25"}],"answer":"B","explanation":"四分位数间距= P75-P25= Q3-Q1= QL-Qu"},{"id":259,"q":"表示一组数据离散程度,稳定、全面且单位与原数据相同的指标是:","options":[{"key":"A","text":"极差"},{"key":"B","text":"四分位数间距"},{"key":"C","text":"CV"},{"key":"D","text":"方差"},{"key":"E","text":"标准差"}],"answer":"E","explanation":"标准差的意义"},{"id":260,"q":"表示一组数据分散程度,最简单易懂易算的指标是:","options":[{"key":"A","text":"方差"},{"key":"B","text":"标准差"},{"key":"C","text":"CV"},{"key":"D","text":"四分位数间距"},{"key":"E","text":"极差"}],"answer":"E","explanation":"离散程度指标中最简单的就是极差。"},{"id":261,"q":"非正态分布数据制定医学参考值范围的方法是:","options":[{"key":"A","text":"百分位数法"},{"key":"B","text":"正态分布法"},{"key":"C","text":"构成比较法"},{"key":"D","text":"标准化法"},{"key":"E","text":"动态数列法"}],"answer":"A","explanation":"参考值范围计算方法有两种正态分布法与百分位数法。非正态分布数据采用百分位数法。"},{"id":262,"q":"设数据为非正态分布,双侧95%参考值范围的公式是:","options":[{"key":"A","text":"均数±1.64×标准差"},{"key":"B","text":"均数±1×标准差"},{"key":"C","text":"P2.5-P97.5"},{"key":"D","text":">P5"},{"key":"E","text":"均数±1.96×标准差"}],"answer":"C","explanation":"参考值范围计算方法有两种正态分布法与百分位数法。非正态分布数据采用百分位数法。计算95%双侧参考值范围要去掉两侧尾部各2.5%的数据。"},{"id":263,"q":"当两个相同单位数据的均数相差很大时,计算变异度的较好指标是:","options":[{"key":"A","text":"方差"},{"key":"B","text":"Q"},{"key":"C","text":"极差"},{"key":"D","text":"变异系数"},{"key":"E","text":"标准差"}],"answer":"D","explanation":"变异系数的用途"},{"id":264,"q":"下列哪个指标不属于变异指标:","options":[{"key":"A","text":"中位数"},{"key":"B","text":"标准差"},{"key":"C","text":"全距"},{"key":"D","text":"四分位间距"},{"key":"E","text":"变异系数"}],"answer":"A","explanation":"集中趋势指标有均数、中位数、几何均数等;离散趋势指标有极差、四分位数间距、方差与标准差、变异系数。"},{"id":265,"q":"若数据为正态分布,双侧95%参考值范围的公式是:","options":[{"key":"A","text":">P5"},{"key":"B","text":"P2.5-P97.5"},{"key":"C","text":"均数±1×标准差"},{"key":"D","text":"均数±1.64×标准差"},{"key":"E","text":"均数±1.96×标准差"}],"answer":"E","explanation":"参考值范围计算方法有两种正态分布法与百分位数法。正态分布数据采用正态分布法。计算95%双侧参考值范围均数加减1.96个标准差。"},{"id":266,"q":"若上海市健康女工744人血红蛋白含量的均数为12.239g,标准差为0.998g,则下列哪个是医学参考值范围:","options":[{"key":"A","text":"11.24-11.3237"},{"key":"B","text":"9.654-14.814"},{"key":"C","text":"10.283-14.195"},{"key":"D","text":"10.592-13.886"},{"key":"E","text":"10.952-13.516"}],"answer":"C","explanation":""},{"id":267,"q":"用来描述偏态分布资料特征的两个指标是:","options":[{"key":"A","text":"均数和中位数"},{"key":"B","text":"均数和标准差"},{"key":"C","text":"均数和极差"},{"key":"D","text":"中位数和四分位数间距"},{"key":"E","text":"几何均数和标准差"}],"answer":"D","explanation":""},{"id":268,"q":"若上海市健康女工744人血红蛋白含量的均数为12.25g,标准差为1.02g,则下列哪个是95%的医学参考值范围:","options":[{"key":"A","text":"11.24-11.33"},{"key":"B","text":"9.65-14.81"},{"key":"C","text":"10.28-14.20"},{"key":"D","text":"10.25-14.25"},{"key":"E","text":"10.95-13.52"}],"answer":"D","explanation":"参考值范围的正态分布法计算公式"},{"id":270,"q":"以下方法中,确定医学参考值范围的最好方法是:","options":[{"key":"A","text":"百分位数法"},{"key":"B","text":"正态分布法"},{"key":"C","text":"对数正态分布法"},{"key":"D","text":"标准化法"},{"key":"E","text":"结合原始数据分布类型选择相应的方法"}],"answer":"E","explanation":"计算参考值范围两种方法:正态分布法与百分位数法,主要根据数据的分布类型选择合适的方法。"},{"id":271,"q":"下列对于正态分布曲线的描述,正确的是:","options":[{"key":"A","text":"当σ不变时,随着μ增大,曲线向右移"},{"key":"B","text":"当σ不变时,随着μ增大,曲线向左移"},{"key":"C","text":"当μ不变时,随着σ增大,曲线向右移"},{"key":"D","text":"当μ不变时,随着σ增大,曲线将变的越来越高越来瘦"},{"key":"E","text":"以上说法均不正确"}],"answer":"A","explanation":"正态分布的特征,位置参数"},{"id":272,"q":"横轴上,正态分布曲线下从μ-2.58σ到μ的面积为:","options":[{"key":"A","text":"95%"},{"key":"B","text":"45%"},{"key":"C","text":"97.5%"},{"key":"D","text":"47.5%"},{"key":"E","text":"49.5%"}],"answer":"E","explanation":"正态分布曲线下的面积规律"},{"id":273,"q":"在正态曲线,下列关于μ-1.96σ到曲线对称轴的面积是:","options":[{"key":"A","text":"90%"},{"key":"B","text":"10%"},{"key":"C","text":"5%"},{"key":"D","text":"45%"},{"key":"E","text":"47.5%"}],"answer":"E","explanation":"正态分布曲线下的面积规律"},{"id":274,"q":"标准正态曲线下,中间95%的面积所对应的横轴范围是:","options":[{"key":"A","text":"-∞到+1.96"},{"key":"B","text":"-1.96到+1.96"},{"key":"C","text":"-∞到+2.58"},{"key":"D","text":"-2.58到+2.58"},{"key":"E","text":"-1.64到+1.64"}],"answer":"B","explanation":"正态分布曲线下的面积规律"},{"id":275,"q":"下列关于医学参考值范围的说法中正确的是:","options":[{"key":"A","text":"医学参考值范围是根据大部分“健康人”的某项指标制定的"},{"key":"B","text":"医学参考值范围的制定方法不受分布资料类型的限制"},{"key":"C","text":"在制定医学参考值范围时,最好用95%范围,因为这个范围最能说明医学问题"},{"key":"D","text":"在制定医学参考值范围时,最好用95%范围,因为这代表了大多数人"},{"key":"E","text":"以上说法均不正确"}],"answer":"A","explanation":"医学参考值范围的含义"},{"id":276,"q":"确定正常人某个指标的参考值范围时,调查对象是:","options":[{"key":"A","text":"从未患过病的人"},{"key":"B","text":"健康达到了要求的人"},{"key":"C","text":"排除影响被研究指标的疾病和因素的人"},{"key":"D","text":"只患过小病但不影响被研究指标的人"},{"key":"E","text":"排除了患过某病或接触过某因素的人"}],"answer":"C","explanation":"医学参考值范围的含义"},{"id":277,"q":"某资料的观察值呈正态分布,理论上有( )的观察值落在“均数±标准差”范围内。","options":[{"key":"A","text":"68.27%"},{"key":"B","text":"90%"},{"key":"C","text":"95%"},{"key":"D","text":"99%"},{"key":"E","text":"45%"}],"answer":"A","explanation":"正态分布曲线下的面积规律及参考值范围的含义"},{"id":278,"q":"正态分布N(μ,σ2),当μ恒定时,σ越小:","options":[{"key":"A","text":"曲线沿横轴越向左移动"},{"key":"B","text":"曲线沿横轴越向右移动"},{"key":"C","text":"观察值变异程度越大,曲线越“矮胖”"},{"key":"D","text":"观察值变异程度越小,曲线越“高瘦”"},{"key":"E","text":"曲线形状和位置不变"}],"answer":"D","explanation":"正态分布的特征,形状参数"},{"id":279,"q":"根据500例正常人的发铅值原始数据(正偏态分布),计算其95%医学参考值范围应采用:","options":[{"key":"A","text":"双侧正态分布法"},{"key":"B","text":"双侧百分位数法"},{"key":"C","text":"单上侧正态分布法"},{"key":"D","text":"单下侧百分位数法"},{"key":"E","text":"单上侧百分位数法"}],"answer":"E","explanation":"根据数据为偏态分布,选择百分位数法计算"},{"id":280,"q":"在正态曲线下,大于μ-2.58σ包含的面积为:","options":[{"key":"A","text":"1%"},{"key":"B","text":"99%"},{"key":"C","text":"0.5%"},{"key":"D","text":"0.05%"},{"key":"E","text":"99.5%"}],"answer":"E","explanation":"正态分布曲线下的面积规律"},{"id":281,"q":"横轴上,正态曲线下从μ到μ+1.96σ的面积为:","options":[{"key":"A","text":"95%"},{"key":"B","text":"45%"},{"key":"C","text":"97.5%"},{"key":"D","text":"47.5%"},{"key":"E","text":"49.5%"}],"answer":"D","explanation":"正态分布曲线下的面积规律"},{"id":282,"q":"为了制定尿铅（正偏态分布）的参考值范围,测定了一批正常人的尿铅含量,下列说法正确的是:","options":[{"key":"A","text":"无法制定,要制定参考值范围必须测定健康人的尿铅含量"},{"key":"B","text":"可以制定,应为单侧上限"},{"key":"C","text":"可以制定,应为单侧下限"},{"key":"D","text":"可以制定,但是无法确定是上侧范围还是下侧范围"},{"key":"E","text":"可以制定双侧95%的参考值范围"}],"answer":"B","explanation":"根据数据为偏态分布,选择百分位数法计算参考值范围,又因铅含量属于要求低于某个值,所以计算上限值。"},{"id":283,"q":"标准正态分布的均数与标准差分别为:","options":[{"key":"A","text":"0,1"},{"key":"B","text":"1,0"},{"key":"C","text":"0,0"},{"key":"D","text":"1,1"},{"key":"E","text":"0.5,1"}],"answer":"A","explanation":"标准正态分布的特征,位置与形状参数"},{"id":284,"q":"健康男子收缩压的参考值范围是指:","options":[{"key":"A","text":"所有健康成年男子收缩压的波动范围"},{"key":"B","text":"绝大多数正常成年男子收缩压的波动范围"},{"key":"C","text":"所有正常成年男子收缩压的波动范围"},{"key":"D","text":"少部分正常成年男子收缩压的波动范围"},{"key":"E","text":"所有正常人收缩压的波动范围"}],"answer":"B","explanation":"参考值范围概念"},{"id":285,"q":"下列关于正态分布曲线的两参数μ和σ的说法,正确的是:","options":[{"key":"A","text":"μ和σ越接近于0时,曲线越扁平"},{"key":"B","text":"曲线形状只与μ有关,μ越大,曲线越扁平"},{"key":"C","text":"曲线形状只与σ有关,σ越大,曲线越扁平"},{"key":"D","text":"曲线形状与两者均无关,绘图者可以随意画"},{"key":"E","text":"以上说法均不正确"}],"answer":"C","explanation":"正态分布的特征,位置与形状参数"},{"id":286,"q":"下列关于标准正态分布的说法中错误的是:","options":[{"key":"A","text":"标准正态分布曲线下总面积为1"},{"key":"B","text":"标准正态分布是μ=0并且σ=1的正态分布"},{"key":"C","text":"任何一种资料只要通过Z变换均能变成标准正态分布"},{"key":"D","text":"标准正态分布的曲线是唯一的"},{"key":"E","text":"因为标准正态分布是对称分布,所以Z≥-1.96与Z≤1.96所对应的曲线下面积相等。"}],"answer":"C","explanation":"只有服从正态分布且标准差已知,或者样本含量比较大的资料才可通过z转换"},{"id":287,"q":"估计医学参考值范围时,哪项说法是错误的:","options":[{"key":"A","text":"“正常人”是指排除了对研究指标有影响的疾病和因素的人"},{"key":"B","text":"需要足够数量,通常样本含量在100例以上"},{"key":"C","text":"“正常”是指健康,没有疾病"},{"key":"D","text":"需要考虑样本的同质性"},{"key":"E","text":"对于某些指标组间差别明显且有实际意义的,应先确定分组,再分别估计医学参考值范围"}],"answer":"C","explanation":"参考值范围的定义中,对“正常”定义并不是一定健康,而是指研究的指标正常即为“正常人”。"},{"id":288,"q":"标准正态分布的方差等于:","options":[{"key":"A","text":"0"},{"key":"B","text":"1"},{"key":"C","text":"1.64"},{"key":"D","text":"1.96"},{"key":"E","text":"2.58"}],"answer":"B","explanation":"标准正态分布的特征,位置与形状参数"},{"id":290,"q":"表示抽样误差大小的指标是:","options":[{"key":"A","text":"标准差"},{"key":"B","text":"两均数差"},{"key":"C","text":"方差"},{"key":"D","text":"离均差平方和"},{"key":"E","text":"标准误"}],"answer":"E","explanation":"标准误的含义"},{"id":291,"q":"均数的标准误反映(D)。","options":[{"key":"A","text":"个体的变异程度"},{"key":"B","text":"集中趋势的位置"},{"key":"C","text":"指标的分布特征"},{"key":"D","text":"样本均数与总体均数的差异"},{"key":"E","text":"频数分布规律"}],"answer":"D","explanation":"标准误的含义"},{"id":292,"q":"均数的标准误大小(n为样本含量),以下叙述正确的是:","options":[{"key":"A","text":"与σ的大小成正比,与n成反比"},{"key":"B","text":"与σ的大小成反比,与n成正比"},{"key":"C","text":"与σ的大小成反比,与n的平方根成正比"},{"key":"D","text":"与σ的大小成正比,与n的平方根成反比"},{"key":"E","text":"与σ的大小成正比,与n的平方根成正比"}],"answer":"D","explanation":"标准误的计算公式"},{"id":293,"q":"标准差与标准误的关系中,正确的是:","options":[{"key":"A","text":"二者均反映抽样误差的大小"},{"key":"B","text":"总体标准差不变时,增大样本例数可以减小标准误"},{"key":"C","text":"总体标准差增大时,总体的标准误也增大"},{"key":"D","text":"样本例数增大时,样本的标准差和标准误都会减小"},{"key":"E","text":"标准差用于计算置信区间,标准误用于计算参考值范围"}],"answer":"B","explanation":"标准差与标准误的区别"},{"id":294,"q":"标准误越大,则表示此次抽样得到的样本均数:","options":[{"key":"A","text":"系统误差越大"},{"key":"B","text": 等于0"},{"key":"B","text":"推断两变量间是否存在直线相关关系"},{"key":"C","text":"检验两总体相关系数是否相等"},{"key":"D","text":"推断两变量间相关方向"},{"key":"E","text":"推断两变量间密切程度"}],"answer":"B","explanation":""},{"id":406,"q":"在相关分析中,若散点分布在一条直线上,则有:","options":[{"key":"A","text":"r=1"},{"key":"B","text":"r=0"},{"key":"C","text":"b=1"},{"key":"D","text":"b=0"},{"key":"E","text":"a=0"}],"answer":"A","explanation":""},{"id":407,"q":"对相关系数假设检验,无效假设是:","options":[{"key":"A","text":"ρ=0"},{"key":"B","text":"ρ≠0"},{"key":"C","text":"ρ>0"},{"key":"D","text":"ρ<0"},{"key":"E","text":"ρ≥0"}],"answer":"A","explanation":""},{"id":408,"q":"在秩相关的分析中,下列叙述不正确的是:","options":[{"key":"A","text":"适用于不服从双变量正态分布的资料"},{"key":"B","text":"总体分布类型未知的资料宜计算rs"},{"key":"C","text":"│rs│≤1"},{"key":"D","text":"查rs界值表时,计算的统计量│rs│越小,所对应的P越小"},{"key":"E","text":"适用于等级资料"}],"answer":"D","explanation":""},{"id":409,"q":"求得相关系数r≠0,下列说法正确的是:","options":[{"key":"A","text":"两变量间有相关关系"},{"key":"B","text":"两变量间无相关关系"},{"key":"C","text":"对r值作假设检验后才能推论"},{"key":"D","text":"r越大越有意义"},{"key":"E","text":"r越小越有意义"}],"answer":"C","explanation":""},{"id":410,"q":"若分析肺活量和身高之间的数量关系,拟用身高值预测肺活量值,亦采用:","options":[{"key":"A","text":"简单相关分析"},{"key":"B","text":"秩相关分析"},{"key":"C","text":"直线回归分析"},{"key":"D","text":"方差分析"},{"key":"E","text":"多重线性回归分析"}],"answer":"C","explanation":""},{"id":411,"q":"简单相关分析,假设检验中无效假设为:","options":[{"key":"A","text":"两变量间相互独立"},{"key":"B","text":"两变量间存在线性关系"},{"key":"C","text":"两变量间存在相互关系"},{"key":"D","text":"两变量间相关关系密切"},{"key":"E","text":"两变量间相关关系不密切"}],"answer":"A","explanation":""},{"id":412,"q":"回归系数的假设检验,其备择假设H1是:","options":[{"key":"A","text":"β=1"},{"key":"B","text":"β≠0"},{"key":"C","text":"β>0"},{"key":"D","text":"β<0"},{"key":"E","text":"β=0"}],"answer":"B","explanation":""},{"id":413,"q":"建立直线回归方程中,下列说法错误的是:","options":[{"key":"A","text":"决定直线的为a和b"},{"key":"B","text":"直线必须通过 x的均数与y的均数对应的点"},{"key":"C","text":"直线向左延长与纵轴相交,其交点的纵坐标=a"},{"key":"D","text":"直线的斜率为b"},{"key":"E","text":"画线时取两X值应是尽量远的两点"}],"answer":"E","explanation":""},{"id":414,"q":"求得Y关于X的线性回归方程后,对回归系数作假设检验的目的是对(B)作出统计推断:","options":[{"key":"A","text":"样本斜率"},{"key":"B","text":"总体斜率"},{"key":"C","text":"样本均数"},{"key":"D","text":"总体均数"},{"key":"E","text":"样本分布"}],"answer":"B","explanation":""},{"id":415,"q":"研究凝血时间和凝血酶元浓度之间有无关系应用:","options":[{"key":"A","text":"t检验"},{"key":"B","text":"u检验"},{"key":"C","text":"F检验"},{"key":"D","text":"相关分析"},{"key":"E","text":"回归分析"}],"answer":"D","explanation":""},{"id":416,"q":"最小二乘估计方法的本质要求是:","options":[{"key":"A","text":"各点到直线的垂直距离的和最小"},{"key":"B","text":"各点到x轴的纵向距离的平方和最大"},{"key":"C","text":"各点到直线的垂直距离的平方和最小"},{"key":"D","text":"各点到直线的纵向距离的平方和最小"},{"key":"E","text":"各点到直线的纵向距离的平方和最大"}],"answer":"D","explanation":""},{"id":417,"q":"对于一组服从双变量正态分布的资料,经直线相关分析得相关系数为正,若对该资料拟合回归直线,其回归系数:","options":[{"key":"A","text":"b>0"},{"key":"B","text":"b<0"},{"key":"C","text":"b=0"},{"key":"D","text":"-1< b <1"},{"key":"E","text":"b>1"}],"answer":"A","explanation":""},{"id":418,"q":"在简单线性回归分析中,Sy·x(又称剩余标准差)反映:","options":[{"key":"A","text":"应变量Y的变异度"},{"key":"B","text":"自变量X的变异度"},{"key":"C","text":"扣除X影响后Y的变异度"},{"key":"D","text":"扣除Y影响后X的变异度"},{"key":"E","text":"回归系数b的变异度"}],"answer":"C","explanation":""},{"id":419,"q":"关于Y=a+bX中的|b|,下列描述不正确的是:","options":[{"key":"A","text":"b是回归直线的斜率"},{"key":"B","text":"b>0表示直线从左下走向右上"},{"key":"C","text":"b<0表示直线从左上走向右下"},{"key":"D","text":"|b|越大。则回归直线越陡"},{"key":"E","text":"b=0表示直线通过原点"}],"answer":"E","explanation":""},{"id":420,"q":"研究身高和体重之间是否有数量依存关系宜采用:","options":[{"key":"A","text":"t检验"},{"key":"B","text":"u检验"},{"key":"C","text":"F检验"},{"key":"D","text":"相关分析"},{"key":"E","text":"回归分析"}],"answer":"E","explanation":""},{"id":421,"q":"当偏态分布双变量中相同秩次较多时,表示它们的相互关系宜计算:","options":[{"key":"A","text":"a"},{"key":"B","text":"b"},{"key":"C","text":"r"},{"key":"D","text":"rs"},{"key":"E","text":"校正rs"}],"answer":"E","explanation":""},{"id":422,"q":"检验总体直线回归方程是否有统计学意义,可采用:","options":[{"key":"A","text":"Z检验或χ2检验"},{"key":"B","text":"方差分析或t检验"},{"key":"C","text":"方差分析或秩和检验"},{"key":"D","text":"Z检验或t检验"},{"key":"E","text":"以上都不对"}],"answer":"B","explanation":""},{"id":423,"q":"表示正态分布双变量间有无关系及其密切程度的统计量是:","options":[{"key":"A","text":"a"},{"key":"B","text":"b"},{"key":"C","text":"r"},{"key":"D","text":"rs"},{"key":"E","text":"校正rs"}],"answer":"C","explanation":""},{"id":424,"q":"在双变量数量依存变化的直线关系中,表示其直线斜率的是:","options":[{"key":"A","text":"a"},{"key":"B","text":"b"},{"key":"C","text":"r"},{"key":"D","text":"rs"},{"key":"E","text":"校正rs"}],"answer":"B","explanation":""},{"id":425,"q":"探讨男性腰围与腹腔内脂肪面的关系,对20名男性志愿受试者测量其腰围(cm),并采用核磁共振成像法测量其腹腔内脂肪面积(cm2),建立有腰围估计腹腔内脂肪面积的回归模型,回归系数为b=2.110,则回归系数的解释为:","options":[{"key":"A","text":"对于健康成年人,腰围每增加1cm,腹腔内脂肪面积平均增加2.110 cm2"},{"key":"B","text":"对于健康成年人,腰围增加1cm,腹腔内脂肪面积一定增加2.110 cm2"},{"key":"C","text":"对于健康成年人,腰围越大,腹腔内脂肪面积一定越大"},{"key":"D","text":"对于健康成年男性,腰围每增加1cm,腹腔内脂肪面积平均增加2.110 cm2"},{"key":"E","text":"对于健康成年男性,腰围增加1cm,腹腔内脂肪面积一定增加2.110 cm2"}],"answer":"D","explanation":""}];
  </script>
  <script>(() => {
  "use strict";

  const DATA = Array.isArray(window.__QUESTIONS__) ? window.__QUESTIONS__ : [];
  const META = window.__QUIZ_META__ || {};
  const TOTAL = DATA.length;
  const state = { order: [], index: 0, completed: false };
  const $ = (id) => document.getElementById(id);
  const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (value) => String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ESC_MAP[ch]);
  const pretty = (value) => esc(value)
    .replace(/χ2|Χ2/g, "χ²")
    .replace(/σ2/g, "σ²")
    .replace(/λ2/g, "λ²")
    .replace(/H0/g, "H₀")
    .replace(/H1/g, "H₁");

  function shuffle(list) {
    const result = list.slice();
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function makeRound() {
    return shuffle(DATA).map((q) => ({
      ...q,
      selected: null,
      submitted: false,
      correct: null,
    }));
  }

  function newRound(notify) {
    state.order = makeRound();
    state.index = 0;
    state.completed = false;
    updateStats();
    render();
    if (notify) toast("已重新打乱");
  }

  function resetAnswers(notify) {
    state.order.forEach((q) => {
      q.selected = null;
      q.submitted = false;
      q.correct = null;
    });
    state.index = 0;
    state.completed = false;
    closeSheet();
    updateStats();
    render();
    if (notify) toast("已重置本轮作答");
  }

  const answeredCount = () => state.order.filter((q) => q.submitted).length;
  const correctCount = () => state.order.filter((q) => q.submitted && q.correct).length;

  function updateStats() {
    const answered = answeredCount();
    const correct = correctCount();
    const wrong = answered - correct;
    const accuracy = answered === 0 ? "—" : `${Math.round((correct / answered) * 100)}%`;
    $("statAnswered").textContent = String(answered);
    $("statCorrect").textContent = String(correct);
    $("statWrong").textContent = String(wrong);
    $("statAccuracy").textContent = accuracy;
    const percent = TOTAL === 0 ? 0 : (answered / TOTAL) * 100;
    $("progressBar").style.width = `${percent}%`;
    $("progressTrack").setAttribute("aria-valuenow", String(Math.round(percent)));
    if (!$("sheet").hidden) renderSheet();
  }

  function optionClass(q, option) {
    const classes = ["option"];
    if (!q.submitted && q.selected === option.key) classes.push("selected");
    if (q.submitted) {
      if (option.key === q.answer) classes.push("is-correct");
      else if (option.key === q.selected) classes.push("is-wrong");
    }
    return classes.join(" ");
  }

  function render() {
    if (state.completed) {
      renderCompletion();
      return;
    }
    const q = state.order[state.index];
    if (!q) return;

    const options = q.options.map((o) => `
      <button type="button" class="${optionClass(q, o)}" data-key="${esc(o.key)}"
        aria-pressed="${q.selected === o.key}" ${q.submitted ? "disabled" : ""}>
        <span class="option-key">${esc(o.key)}</span>
        <span class="option-text">${pretty(o.text)}</span>
      </button>`).join("");

    let feedback = "";
    if (q.submitted) {
      const correctOption = q.options.find((o) => o.key === q.answer);
      const answerText = correctOption ? `${q.answer}. ${correctOption.text}` : q.answer;
      const explanation = q.explanation
        ? `<div class="explanation">解析：${pretty(q.explanation)}</div>`
        : "";
      feedback = `
        <div class="feedback ${q.correct ? "correct" : "wrong"}" role="status">
          <div class="feedback-title">${q.correct ? "✓ 回答正确" : "✗ 回答错误"}</div>
          <div class="answer-line">正确答案：<strong>${pretty(answerText)}</strong></div>
          ${explanation}
        </div>`;
    }

    const actions = q.submitted
      ? `<button type="button" class="btn primary" id="nextBtn">${state.index === TOTAL - 1 ? "查看答题卡" : "下一题"}</button>
         <button type="button" class="btn ghost" id="prevBtn" ${state.index === 0 ? "disabled" : ""}>上一题</button>
         <span class="spacer"></span>
         <span class="hint">答对 ${correctCount()} / 已答 ${answeredCount()} 题</span>`
      : `<button type="button" class="btn primary" id="submitBtn" ${q.selected ? "" : "disabled"}>提交答案</button>
         <button type="button" class="btn ghost" id="prevBtn" ${state.index === 0 ? "disabled" : ""}>上一题</button>
         <span class="spacer"></span>
         <span class="hint">快捷键：A–E / 1–5 选择，Enter 提交</span>`;

    $("questionCard").innerHTML = `
      <div class="q-head">
        <span class="q-index">第 ${state.index + 1} / ${TOTAL} 题</span>
        <span class="q-origin">原题 #${q.id}</span>
      </div>
      <p class="q-text">${pretty(q.q)}</p>
      <div class="options" role="group" aria-label="选项">${options}</div>
      ${feedback}
      <div class="actions">${actions}</div>`;

    $("questionCard").querySelectorAll(".option").forEach((button) => {
      button.addEventListener("click", () => choose(button.dataset.key));
    });
    if ($("submitBtn")) $("submitBtn").addEventListener("click", submit);
    if ($("nextBtn")) $("nextBtn").addEventListener("click", next);
    if ($("prevBtn")) $("prevBtn").addEventListener("click", previous);
  }

  function choose(key) {
    const q = state.order[state.index];
    if (!q || q.submitted) return;
    q.selected = key;
    $("questionCard").querySelectorAll(".option").forEach((button) => {
      const active = button.dataset.key === key;
      button.classList.toggle("selected", active);
      button.setAttribute("aria-pressed", String(active));
    });
    if ($("submitBtn")) $("submitBtn").disabled = false;
  }

  function submit() {
    const q = state.order[state.index];
    if (!q || q.submitted || !q.selected) return;
    q.submitted = true;
    q.correct = q.selected === q.answer;
    updateStats();
    render();
  }

  function next() {
    if (state.completed) return;
    if (state.index < TOTAL - 1) {
      state.index += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (answeredCount() < TOTAL) {
      openSheet();
      toast(`还有 ${TOTAL - answeredCount()} 题未答`);
      return;
    }
    state.completed = true;
    updateStats();
    render();
  }

  function previous() {
    if (state.completed) {
      state.completed = false;
      state.index = TOTAL - 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (state.index > 0) {
      state.index -= 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function renderCompletion() {
    const answered = answeredCount();
    const correct = correctCount();
    const accuracy = answered === 0 ? 0 : Math.round((correct / answered) * 100);
    $("questionCard").innerHTML = `
      <div class="completion">
        <div class="mark">✓</div>
        <h2>本轮完成</h2>
        <p>已答 ${answered} / ${TOTAL} 题 · 答对 ${correct} 题 · 正确率 ${accuracy}%</p>
        <div class="actions">
          <button type="button" class="btn primary" id="againBtn">重新打乱再来一轮</button>
          <button type="button" class="btn ghost" id="reviewBtn">查看答题卡</button>
          <button type="button" class="btn ghost" id="lastBtn">回到最后一题</button>
        </div>
      </div>`;
    $("againBtn").addEventListener("click", () => {
      if (confirm("重新打乱会清空本轮作答，继续？")) newRound(true);
    });
    $("reviewBtn").addEventListener("click", openSheet);
    $("lastBtn").addEventListener("click", () => {
      state.completed = false;
      state.index = TOTAL - 1;
      render();
    });
  }

  function renderSheet() {
    $("sheetGrid").innerHTML = state.order.map((q, i) => {
      const classes = ["sheet-cell"];
      if (q.submitted && q.correct) classes.push("correct");
      if (q.submitted && !q.correct) classes.push("wrong");
      if (!state.completed && i === state.index) classes.push("current");
      return `<button type="button" class="${classes.join(" ")}" data-index="${i}"
        aria-label="第 ${i + 1} 题${q.submitted ? (q.correct ? "，答对" : "，答错") : "，未答"}"
        aria-current="${!state.completed && i === state.index ? "true" : "false"}">${i + 1}</button>`;
    }).join("");

    $("sheetGrid").querySelectorAll(".sheet-cell").forEach((button) => {
      button.addEventListener("click", () => {
        state.index = Number(button.dataset.index);
        state.completed = false;
        closeSheet();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function openSheet() {
    renderSheet();
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    $("sheet").hidden = true;
    document.body.style.overflow = "";
  }

  let toastTimer = 0;
  function toast(message) {
    const node = $("toast");
    node.textContent = message;
    node.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => node.classList.remove("show"), 1800);
  }

  function confirmReset() {
    if (answeredCount() > 0 && !confirm("清空本轮作答？")) return;
    resetAnswers(true);
  }

  function confirmShuffle() {
    if (answeredCount() > 0 && !confirm("重新打乱会清空本轮作答，继续？")) return;
    newRound(true);
  }

  function bindChrome() {
    $("sheetBtn").addEventListener("click", openSheet);
    $("closeSheet").addEventListener("click", closeSheet);
    $("shuffleBtn").addEventListener("click", confirmShuffle);
    $("resetBtn").addEventListener("click", confirmReset);
    $("sheet").addEventListener("click", (event) => {
      if (event.target === $("sheet")) closeSheet();
    });

    document.addEventListener("keydown", (event) => {
      if (!$("sheet").hidden) {
        if (event.key === "Escape") closeSheet();
        return;
      }
      if (event.target instanceof HTMLElement &&
          ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (event.key === "Enter" && event.target instanceof HTMLElement &&
          event.target.closest("button")) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        previous();
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        next();
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        const q = state.order[state.index];
        if (q && q.submitted) next();
        else submit();
        return;
      }
      const numeric = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E" };
      const key = numeric[event.key] || (/^[a-eA-E]$/.test(event.key) ? event.key.toUpperCase() : null);
      if (key) {
        event.preventDefault();
        choose(key);
      }
    });
  }

  function init() {
    if (TOTAL === 0) {
      $("questionCard").textContent = "题库为空。";
      return;
    }
    $("totalLabel").textContent = String(TOTAL);
    $("totalLabelMeta").textContent = String(TOTAL);
    $("removedLabel").textContent = String(META.removed || 0);
    $("originalLabel").textContent = String(META.original || 0);
    bindChrome();
    newRound(false);
    updateStats();
  }

  init();
})();
</script>
</body>
</html>
